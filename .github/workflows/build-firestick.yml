name: Build Free My TV Firestick

on:
  workflow_dispatch:
  push:
    branches:
      - firestick-build
    paths:
      - '.github/workflows/build-firestick.yml'
      - 'app/src/io/freemytv/RemoteKeyService.java'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build tools
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER" || { echo "Android sdkmanager not found in $ANDROID_HOME"; exit 1; }
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          java -version
          ls "$ANDROID_HOME/build-tools/34.0.0/aapt2"

      - name: Configure Sao Paulo
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          cp config.example.properties config.properties
          if [ -z "$TMDB_API_KEY" ]; then echo 'TMDB_API_KEY secret is missing'; exit 1; fi
          sed -i "s|^tmdb_key=.*|tmdb_key=$TMDB_API_KEY|" config.properties
          sed -i 's/^tmdb_region=.*/tmdb_region=BR/' config.properties
          sed -i 's/^latitude=.*/latitude=-23.5505/' config.properties
          sed -i 's/^longitude=.*/longitude=-46.6333/' config.properties
          sed -i 's/^city=.*/city=Sao Paulo/' config.properties
          sed -i 's/^language=.*/language=pt/' config.properties
          sed -i 's/^currency=.*/currency=BRL/' config.properties
          sed -i 's/^temperature=.*/temperature=C/' config.properties
          sed -i 's/^show_crypto=.*/show_crypto=false/' config.properties

      - name: Build and record diagnostics
        shell: bash
        run: |
          set -o pipefail
          bash build.sh 2>&1 | tee build.log
          test -s FreeMyTV.apk

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Firestick-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FreeMyTV-Firestick-Test
          path: FreeMyTV.apk
          retention-days: 7
